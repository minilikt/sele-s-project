name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (Sigma engine + API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siem/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: siem/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate every Sigma rule parses
        run: |
          python - <<'PY'
          from sigma import SigmaEngine
          result = SigmaEngine.load_rules(["rules"])
          if result.errors:
              for error in result.errors:
                  print(f"::error file={error['path']}::{error['error']}")
              raise SystemExit(1)
          print(f"{len(result.rules)} Sigma rule(s) validated")
          PY

      - name: Run tests
        run: python -m pytest -q

  postgres-tests:
    name: Backend tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siem/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siem
          POSTGRES_PASSWORD: siem
          POSTGRES_DB: siem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siem -d siem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SIEM_DATABASE_URL: postgresql+psycopg://siem:siem@localhost:5432/siem_test
      SIEM_JWT_SECRET: ci-only-secret
      SIEM_ADMIN_USER: admin
      SIEM_ADMIN_PASSWORD: ci-admin-password
      SIEM_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: siem/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations with the Alembic CLI
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  argus-tests:
    name: ARGUS tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: argus/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate Alembic history
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Run tests
        run: python -m pytest -q

  argus-postgres-tests:
    name: ARGUS tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ARGUS_DATABASE_URL: postgresql+psycopg://argus:argus@localhost:5432/argus_test
      ARGUS_JWT_SECRET: ci-only-secret
      ARGUS_ADMIN_USER: admin
      ARGUS_ADMIN_PASSWORD: ci-admin-password
      ARGUS_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: argus/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations with the Alembic CLI
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

  argus-frontend-build:
    name: ARGUS frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: argus/frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siem/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: siem/frontend/package-lock.json

      - run: npm ci
      - run: npm run build
