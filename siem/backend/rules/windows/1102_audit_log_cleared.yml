title: Security Audit Log Cleared
id: sigma-win-1102-audit-log-cleared
status: stable
description: >
  Detects clearing of the Windows Security audit log (Event ID 1102). Attackers
  clear logs to remove evidence of prior activity, so this event should be
  treated as high priority even in isolation.
author: SENTINEL SIEM
date: 2026/10/25
references:
  - https://attack.mitre.org/techniques/T1070/001/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 1102
      - 104
  condition: selection
level: critical
tags:
  - attack.defense_evasion
  - attack.t1070.001
falsepositives:
  - Administrator clearing logs during documented troubleshooting
